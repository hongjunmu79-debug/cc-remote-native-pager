name: CI

# Push/PR gate. Tagged releases use release.yml (deeper build + publication).
# Every step here is zero-token and does not publish anything.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Canonical metadata consistency + repository identity + secret scan. This is
  # the same gate release.yml's verify job runs, so a PR that would fail a
  # release is caught here first.
  release-metadata:
    name: Release metadata, identity, and secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate canonical release metadata
        run: |
          python deploy/validate_release_metadata.py --root .
          python deploy/validate_release_metadata.py --root . \
            > /tmp/metadata.txt
          cat /tmp/metadata.txt

  python:
    name: Python tests (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Install Python dependencies
        run: |
          uv venv --python 3.13 .venv
          uv pip sync \
            --python .venv/bin/python \
            --require-hashes --only-binary=:all: --no-binary=http-ece \
            requirements.lock
          uv pip install --python .venv/bin/python -r requirements-dev.txt
      - name: Python tests
        run: .venv/bin/python -m pytest
      - name: Ruff
        run: uvx --from ruff==0.15.13 ruff check cc_remote tests deploy
      - name: Git hygiene
        run: git diff --check

  # The Windows distribution tests run on a Windows runner. They only need
  # pytest + stdlib: the packaging modules (win_config/win_layout/win_manifest/
  # win_smoke/win_build) are deliberately dependency-free.
  python-windows:
    name: Windows distribution tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Run packaging tests
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests/test_windows_packaging.py -q

  web:
    name: Web client (build + reliability + lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web run test:reliability
      - run: npm --prefix web run lint

  android:
    name: Android (unit tests + lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unit tests
        working-directory: android-native
        run: ./gradlew testDebugUnitTest
      - name: Lint
        working-directory: android-native
        run: ./gradlew lintDebug
