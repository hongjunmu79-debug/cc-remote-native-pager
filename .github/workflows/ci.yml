name: CI

# Push/PR gate. Tagged releases use release.yml (deeper build + publication).
# Every step here is zero-token and does not publish anything.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Canonical metadata consistency + repository identity + secret scan. This is
  # the same gate release.yml's verify job runs, so a PR that would fail a
  # release is caught here first.
  release-metadata:
    name: Release metadata, identity, and secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate canonical release metadata
        run: |
          python deploy/validate_release_metadata.py --root .
          python deploy/validate_release_metadata.py --root . \
            > /tmp/metadata.txt
          cat /tmp/metadata.txt

  python:
    name: Python tests (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Install Python dependencies
        run: |
          uv venv --python 3.13 .venv
          uv pip sync \
            --python .venv/bin/python \
            --require-hashes --only-binary=:all: --no-binary=http-ece \
            requirements.lock
          uv pip install --python .venv/bin/python -r requirements-dev.txt
      # The release-bundle tests build a relay bundle, which requires the web
      # client to be materialized. Mirror release.yml's verify job so the
      # push/PR gate exercises the same sequence.
      - name: Materialize Web client for release tests
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Python tests
        run: .venv/bin/python -m pytest
      - name: Ruff
        run: uvx --from ruff==0.15.13 ruff check cc_remote tests deploy
      - name: Git hygiene
        run: git diff --check

  # Windows runs the production-relevant distribution tests: the packaging /
  # install / rollback / dual-process smoke suite, the Windows import-compat
  # contract, the canonical release-metadata contract, and the release-workflow
  # contracts (fail-closed signing, signer SHA-256, distribution-tag-only
  # publication, immutable action pins). POSIX-only release tests (chmod,
  # symlinks, atomic-rename, shell installers) deliberately run on Ubuntu only.
  python-windows:
    name: Windows distribution + release-contract tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      # Same canonical inputs as the Ubuntu python job: the hash-verified
      # universal lock plus the dev set. test_release_distribution imports
      # cc_remote.protocol, which needs typing_extensions/pydantic from the
      # runtime lock; installing pytest alone is not enough.
      - name: Install Python dependencies
        run: |
          uv venv --python 3.11 .venv
          uv pip sync `
            --python .venv\Scripts\python.exe `
            --require-hashes --only-binary=:all: --no-binary=http-ece `
            requirements.lock
          uv pip install --python .venv\Scripts\python.exe -r requirements-dev.txt
      - name: Run packaging, lifecycle, and release-contract tests
        env:
          PYTHONUTF8: "1"
        run: |
          .venv\Scripts\python.exe -m pytest `
            tests/test_windows_packaging.py `
            tests/test_windows_import_compat.py `
            tests/test_release_metadata.py `
            tests/test_release_distribution.py::test_release_workflow_materializes_web_before_python_bundle_tests `
            tests/test_release_distribution.py::test_ci_python_job_materializes_web_before_python_tests `
            tests/test_release_distribution.py::test_workflow_if_conditions_never_reference_secrets `
            tests/test_release_distribution.py::test_role_installers_avoid_ambiguous_and_or_guards `
            tests/test_release_distribution.py::test_role_locks_and_release_workflow_are_versioned_inputs `
            tests/test_release_distribution.py::test_release_locks_keep_intel_macos_cryptography_wheel `
            tests/test_release_distribution.py::test_release_metadata_android_signer_sha256_is_validated `
            tests/test_release_distribution.py::test_release_tag_contract_accepts_only_canonical_distribution_tag `
            tests/test_release_distribution.py::test_release_workflow_android_signing_is_fail_closed `
            tests/test_release_distribution.py::test_release_workflow_publish_is_tag_push_only `
            -q

  web:
    name: Web client (build + reliability + lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web run test:reliability
      - run: npm --prefix web run lint

  android:
    name: Android (unit tests + lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Unit tests
        working-directory: android-native
        run: ./gradlew testDebugUnitTest
      - name: Lint
        working-directory: android-native
        run: ./gradlew lintDebug
      - name: Release build validation
        # Assemble the release APK unsigned (no signing secrets on a push/PR
        # gate) so lint + R8/minify + packaging are exercised on every commit.
        working-directory: android-native
        run: ./gradlew assembleRelease
