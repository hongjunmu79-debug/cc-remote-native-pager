name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"   # distribution tags such as v3.0.0-pager.5

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Validate canonical release metadata
        run: python deploy/validate_release_metadata.py --root .
      - name: Verify tag, product, and distribution versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from cc_remote import __version__

          tag = os.environ["RELEASE_TAG"]
          metadata = json.loads(Path("deploy/release-metadata.json").read_text())
          expected_tags = {
              f"v{__version__}",
              f"v{metadata['product_version']}",
              f"v{metadata['distribution_version']}",
          }
          if tag not in expected_tags:
              raise SystemExit(
                  f"release tag {tag!r} not in allowed set {sorted(expected_tags)!r}"
              )
          package = json.loads(Path("web/package.json").read_text())
          lock = json.loads(Path("web/package-lock.json").read_text())
          if package["version"] != __version__:
              raise SystemExit("web/package.json version does not match backend")
          if lock["version"] != __version__:
              raise SystemExit("web/package-lock.json version does not match backend")
          if metadata["product_version"] != __version__:
              raise SystemExit(
                  "deploy/release-metadata.json product_version does not match backend"
              )
          PY
      - name: Install Python test dependencies
        run: |
          uv venv --python 3.13 .venv
          uv pip sync \
            --python .venv/bin/python \
            --require-hashes --only-binary=:all: --no-binary=http-ece \
            requirements.lock
          uv pip install --python .venv/bin/python -r requirements-dev.txt
      - name: Materialize Web client for release tests
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Python tests and lint
        run: |
          .venv/bin/python -m pytest
          uvx --from ruff==0.15.13 ruff check cc_remote tests deploy
      - name: Web tests and lint
        run: |
          npm --prefix web run test:reliability
          npm --prefix web run lint
      - name: Release script syntax
        run: |
          bash -n \
            deploy/install.sh \
            deploy/install-relay.sh \
            deploy/install-wrapper.sh \
            deploy/setup-vps.sh
          shellcheck -x \
            deploy/install.sh \
            deploy/install-relay.sh \
            deploy/install-wrapper.sh \
            deploy/setup-vps.sh \
            deploy/setup_transaction.sh
          git diff --check

  build:
    name: Build ${{ matrix.role }} ${{ matrix.os }}/${{ matrix.arch }}
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: relay
            os: linux
            arch: x86_64
            runner: ubuntu-24.04
            expected_uname: x86_64
          - role: relay
            os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            expected_uname: aarch64
          - role: wrapper
            os: linux
            arch: x86_64
            runner: ubuntu-24.04
            expected_uname: x86_64
          - role: wrapper
            os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            expected_uname: aarch64
          - role: wrapper
            os: darwin
            arch: x86_64
            runner: macos-15-intel
            expected_uname: x86_64
          - role: wrapper
            os: darwin
            arch: arm64
            runner: macos-15
            expected_uname: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Verify native runner architecture
        env:
          EXPECTED_UNAME: ${{ matrix.expected_uname }}
        run: test "$(uname -m)" = "$EXPECTED_UNAME"
      - name: Build Relay web client
        if: matrix.role == 'relay'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Materialize Relay web client
        if: matrix.role == 'relay'
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Build deterministic role bundle
        env:
          RELEASE_ROLE: ${{ matrix.role }}
          RELEASE_OS: ${{ matrix.os }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          python -m deploy.build_release \
            --output-dir dist \
            --role "$RELEASE_ROLE" \
            --os "$RELEASE_OS" \
            --arch "$RELEASE_ARCH" \
            --uv-bin "$(command -v uv)" \
            --git-sha "$GITHUB_SHA" \
            --source-date-epoch "$source_date_epoch"
          tar -tzf dist/*.tar.gz >/dev/null
      - name: Install and import the packaged role
        env:
          RELEASE_ROLE: ${{ matrix.role }}
          RELEASE_OS: ${{ matrix.os }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          smoke="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$smoke"
          bundle="$smoke/cc-remote-$RELEASE_ROLE-${GITHUB_REF_NAME}"
          test -x "$bundle/bin/uv"
          "$bundle/bin/uv" --version
          python_runtime="$(cat deploy/python-version.txt)"
          UV_PYTHON_INSTALL_DIR="$smoke/python" \
            "$bundle/bin/uv" venv \
            --no-project --managed-python --python "$python_runtime" \
            "$bundle/.smoke-venv"
          "$bundle/bin/uv" pip sync \
            --python "$bundle/.smoke-venv/bin/python" \
            --require-hashes --only-binary=:all: --no-binary=http-ece \
            "$bundle/requirements-$RELEASE_ROLE.lock"
          (
            cd "$bundle"
            PYTHONPATH="$bundle" "$bundle/.smoke-venv/bin/python" \
              -m deploy.release_manifest "$bundle" \
              --role "$RELEASE_ROLE" --os "$RELEASE_OS" --arch "$RELEASE_ARCH"
            if [ "$RELEASE_ROLE" = wrapper ]; then
              PYTHONPATH="$bundle" "$bundle/.smoke-venv/bin/python" -c \
                'from cc_remote.wrapper.machine import WrapperMachine; assert WrapperMachine'
            else
              PYTHONPATH="$bundle" "$bundle/.smoke-venv/bin/python" -c \
                'from cc_remote.relay.server import create_app; assert create_app'
            fi
          )
          rm -rf -- "$smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.role }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Source-built Windows distribution: web/dist is built from this checkout,
  # the archive is assembled by packaging\windows\build.ps1 (deterministic zip,
  # payload manifest, smoke suite, SHA-256), and both the archive and its
  # checksum are uploaded. No node LAN proxy, no shipped .venv.
  build-windows:
    name: Build Windows distribution
    needs: verify
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install uv (pinned; must match deploy/uv-version.txt)
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Materialize the Web client
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Build the deterministic Windows archive
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          $epoch = (git show -s --format=%ct $env:GITHUB_SHA)
          $uvExe = (Get-Command uv).Source
          if (-not $uvExe) { throw "uv not found on PATH" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File `
            packaging\windows\build.ps1 `
            -SourceRoot . -OutputDir dist -UvExe $uvExe `
            -GitSha $env:GIT_SHA -SourceDateEpoch $epoch
      - name: Verify archive and checksum exist
        shell: powershell
        run: |
          $zip = Get-ChildItem dist\cc-remote-*.zip | Select-Object -First 1
          $sha = Get-ChildItem dist\cc-remote-*.zip.sha256 | Select-Object -First 1
          if (-not $zip -or -not $sha) { throw "archive or checksum missing" }
          Write-Host "Built $($zip.Name) ($($zip.Length) bytes)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-dist
          path: dist/cc-remote-*
          if-no-files-found: error
          retention-days: 7

  # Source-built Android pager APK. Unit tests + lint must pass before the
  # release APK is assembled. When PAGER_KEYSTORE_B64 and
  # PAGER_SIGNING_PROPERTIES secrets are present, assembleRelease produces a
  # signed APK; otherwise it assembles an unsigned release APK (CI gate only —
  # a publish without signing secrets should not happen for real releases).
  build-android:
    name: Build Android pager APK
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unit tests
        working-directory: android-native
        run: ./gradlew testDebugUnitTest
      - name: Lint
        working-directory: android-native
        run: ./gradlew lintDebug
      - name: Configure release signing from secrets
        shell: bash
        env:
          PAGER_KEYSTORE_B64: ${{ secrets.PAGER_KEYSTORE_B64 }}
          PAGER_SIGNING_PROPERTIES: ${{ secrets.PAGER_SIGNING_PROPERTIES }}
        run: |
          set -euo pipefail
          # The `secrets` context is not available in `if:` conditions, so this
          # step always runs and the shell decides. An absent secret resolves
          # to the empty string; when either secret is missing we build an
          # unsigned release APK (CI gate only) and leave PAGER_SIGNING_PROPERTIES
          # unset so Gradle does not try to configure a signing config.
          if [ -z "$PAGER_KEYSTORE_B64" ] || [ -z "$PAGER_SIGNING_PROPERTIES" ]; then
            echo "release signing secrets are not configured; building an unsigned release APK"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/pager-keys"
          printf '%s' "$PAGER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pager-keys/pager.keystore"
          # storeFile in the properties is relative to the properties file's
          # directory, so co-locate the keystore and the properties file.
          printf '%s\n' "$PAGER_SIGNING_PROPERTIES" > "$RUNNER_TEMP/pager-keys/signing.properties"
          echo "PAGER_SIGNING_PROPERTIES=$RUNNER_TEMP/pager-keys/signing.properties" >> "$GITHUB_ENV"
      - name: Assemble release APK
        working-directory: android-native
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: android-native/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish GitHub Release
    # All build gates must pass; a failure in any of them blocks publication.
    needs: [build, build-windows, build-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "bundle-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "windows-dist"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "android-apk"
          path: dist
          merge-multiple: true
      - name: Assemble checksummed release assets
        run: |
          cp deploy/install.sh dist/install.sh
          chmod 0755 dist/install.sh
          (
            cd dist
            printf '%s\n' \
              cc-remote-*.tar.gz \
              cc-remote-*.zip \
              cc-remote-*.zip.sha256 \
              *.apk \
              install.sh |
              sort | xargs sha256sum > SHA256SUMS
          )
          test "$(find dist -name 'cc-remote-*.tar.gz' | wc -l)" -eq 6
          test "$(find dist -name 'cc-remote-*.zip' | wc -l)" -eq 1
          test "$(find dist -name '*.apk' | wc -l)" -ge 1
          ls -1 dist
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "dist/*"
      - name: Create draft, upload assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            test "$is_draft" = true || {
              echo "refusing to replace an already-published release" >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "cc-remote $RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
